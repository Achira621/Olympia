<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="100%" height="100%">
  <defs>
    <linearGradient id="goldHGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA820A"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#F3E7C5"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="charcoalHGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#2E2A25"/>
    </linearGradient>
    <filter id="goldHGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled & positioned at x=0, y=0) -->
  <g transform="translate(4, 2) scale(0.33)">
    <!-- Embracing Arc -->
    <circle cx="100" cy="104" r="76" fill="none" stroke="url(#goldHGrad)" stroke-width="3" stroke-dasharray="380 90" stroke-dashoffset="40" opacity="0.9"/>
    <circle cx="100" cy="104" r="84" fill="none" stroke="#E5DED2" stroke-width="1.5" stroke-dasharray="240 180" stroke-dashoffset="120" opacity="0.7"/>

    <!-- Left Pillar -->
    <path d="M78 108 L78 160 C78 161.5 79.2 162 81 162 L87 162 C88.8 162 90 161.5 90 160 L90 114 C90 112 88.5 110 86 109 Z" fill="url(#charcoalHGrad)"/>
    <!-- Central Pillar -->
    <path d="M95 96 L95 160 C95 161.5 96.2 162 98 162 L105 162 C106.8 162 108 161.5 108 160 L108 84 C108 81.5 106 79.5 103 80 C98.5 81 95 87 95 96 Z" fill="url(#charcoalHGrad)"/>
    <!-- Right Pillar -->
    <path d="M113 104 L113 160 C113 161.5 114.2 162 116 162 L122 162 C123.8 162 125 161.5 125 160 L125 116 C125 113.5 123 111 120 110 Z" fill="url(#charcoalHGrad)"/>
    <!-- Base -->
    <rect x="74" y="164" width="55" height="4" rx="2" fill="url(#goldHGrad)"/>
    <!-- Flame -->
    <path d="M102 78 C99 68 102 52 112 36 C116 30 122 24 126 18 C126.5 17.5 127.5 18 127 19 C124 28 122 36 124 44 C126 52 133 60 134 70 C135 80 128 88 118 90 C125 80 124 66 118 56 C114 50 110 46 109 40 C108.5 39 107.5 39.5 107.8 40.5 C109 48 108 58 104 66 C102.5 69 101.5 73 102 78 Z" fill="url(#goldHGrad)" filter="url(#goldHGlow)"/>
    <!-- Inner Flame Flare -->
    <path d="M112 68 C110 60 113 50 118 42 C118.5 41 119.5 41.5 119.2 42.5 C117.5 48 118 54 122 60 C124 63 125 67 124 72 C122 76 117 78 113 77 C112 75 111.5 71 112 68 Z" fill="#FFF9E6" opacity="0.95"/>
  </g>

  <!-- OLYMPIA Wordmark -->
  <text x="82" y="44" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="800" letter-spacing="4" fill="#2E2A25">
    OLYMPI<tspan fill="url(#goldHGrad)">A</tspan>
  </text>

  <!-- Tagline -->
  <text x="85" y="58" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.2" fill="#8B857C">
    ANALYSE · DISCOVER · EMPOWER
  </text>
</svg>
